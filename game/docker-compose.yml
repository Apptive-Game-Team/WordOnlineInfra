# One deployer per game environment. Each watches its image tag and, when it
# changes, swaps that environment's two slots.
#
# The deployer holds no description of a slot — no ports, no env files, no
# volumes. It rebuilds each slot from that slot's own container config, so
# whatever a slot needs stays with the slot. See game/README.md.
#
# GROUP_LABEL is what keeps the environments apart. A deployer only ever
# touches containers carrying its own label.

x-deployer: &deployer
  # Built and pushed by .github/workflows/docker-ci.yml. `build` stays so
  # `docker compose up --build` still works when testing a local change.
  image: ${DEPLOYER_IMAGE:-ghcr.io/apptive-game-team/arcane-casters-deployer:latest}
  build: .
  restart: unless-stopped
  networks:
    - net
  volumes:
    # Root-equivalent access to the host. Never expose a port on these
    # containers and only run an image built from this directory.
    - /var/run/docker.sock:/var/run/docker.sock
    # Registry credentials live with the docker client, not the daemon, so a
    # pull from inside this container is anonymous without them and the private
    # game image comes back `unauthorized`.
    - ${DOCKER_CONFIG_DIR:-~/.docker}/config.json:/root/.docker/config.json:ro
  labels:
    # Watchtower must not restart a deployer mid-swap.
    com.centurylinklabs.watchtower.enable: "false"

x-endpoints: &endpoints
  # Endpoints on the game server, reached over the docker network. Change them
  # here when the server-side routes move; the deployer image stays as is.
  HEALTH_PATH: /actuator/health
  HEALTH_UP_PATTERN: '"status":"UP"'
  DRAIN_PATH: /api/server/servers/mine/state/draining
  DRAIN_METHOD: POST
  CONTAINER_PORT: 8080
  CONTAINER_MANAGEMENT_PORT: 8081

services:
  ac-game-deployer:
    <<: *deployer
    container_name: ac-game-deployer
    environment:
      <<: *endpoints
      IMAGE: ${AC_GAME_IMAGE:-ghcr.io/apptive-game-team/arcane-casters-game:latest}
      GROUP_LABEL: wordonline.group=ac-game
      CICD_TOKEN: ${AC_CICD_TOKEN}
      DISCORD_WEBHOOK_URL: ${AC_DISCORD_WEBHOOK_URL:-${DISCORD_WEBHOOK_URL:-}}
      POLL_INTERVAL: 300
      HEALTH_TIMEOUT: 300
      # Real matches. Wait an hour before taking a slot down by force.
      DRAIN_TIMEOUT: 3600

  dev-game-deployer:
    <<: *deployer
    container_name: dev-game-deployer
    environment:
      <<: *endpoints
      IMAGE: ${DEV_GAME_IMAGE:-ghcr.io/apptive-game-team/arcane-casters-game:dev}
      GROUP_LABEL: wordonline.group=dev-game
      CICD_TOKEN: ${DEV_CICD_TOKEN}
      DISCORD_WEBHOOK_URL: ${DEV_DISCORD_WEBHOOK_URL:-${DISCORD_WEBHOOK_URL:-}}
      # Every push to main lands here, so poll often.
      POLL_INTERVAL: 60
      HEALTH_TIMEOUT: 300
      # Test matches. Do not let one hold a deploy up for long.
      DRAIN_TIMEOUT: 300

networks:
  net:
    external: true
