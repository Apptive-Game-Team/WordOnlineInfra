services:
  game-deployer:
    # Built and pushed by .github/workflows/docker-ci.yml. `build` stays so
    # `docker compose up --build` still works when testing a local change.
    image: ${DEPLOYER_IMAGE:-ghcr.io/apptive-game-team/arcane-casters-deployer:latest}
    build: .
    container_name: game-deployer
    restart: unless-stopped
    labels:
      # Watchtower must not restart the deployer mid-swap.
      com.centurylinklabs.watchtower.enable: "false"
    networks:
      - wordonline
    volumes:
      # Root-equivalent access to the host. Never expose a port on this
      # container and only run images you build yourself.
      - /var/run/docker.sock:/var/run/docker.sock
      # Environment for the game containers the deployer starts. PORT,
      # MANAGEMENT_PORT and EXTERNAL_PORT are injected per slot and must not
      # be set here.
      - ./game.env:/config/game.env:ro
    environment:
      IMAGE: ${GAME_IMAGE}
      NETWORK: wordonline
      CICD_TOKEN: ${CICD_TOKEN}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      POLL_INTERVAL: 300
      SLOT_A_NAME: game-blue
      SLOT_A_PORT: 8080
      SLOT_A_MANAGEMENT_PORT: 8081
      SLOT_B_NAME: game-green
      SLOT_B_PORT: 8090
      SLOT_B_MANAGEMENT_PORT: 8091
      HEALTH_TIMEOUT: 300
      DRAIN_TIMEOUT: 3600
      # Endpoints on the game server. Change them here when the server-side
      # routes move; the deployer image stays as is.
      HEALTH_PATH: /actuator/health
      HEALTH_UP_PATTERN: '"status":"UP"'
      DRAIN_PATH: /api/server/servers/mine/state/draining
      DRAIN_METHOD: POST

networks:
  wordonline:
    external: true
